# Token pricing, USD per 1,000,000 tokens.
# Source + retrieval date belongs in METRICS.md, not here — this file is
# machine-read by cost.py and should stay pure data.
#
# NOTE: these are placeholder figures. Verify against each provider's live
# pricing page before trusting REPORT.md or METRICS.md.
#
# image_per_million intentionally REMOVED as of the schema rewrite that
# matches the assignment brief: the brief's cost formula (Section 5, B2)
# bills combined input (text + image) tokens at ONE input rate — there is
# no separate image rate in the required formula. cost.py no longer reads
# an image_per_million field even if one is present here.

gemini-3-flash:
  input_per_million: 0.075
  output_per_million: 0.30
  note: "superseded by gemini-3.6-flash below as of this project's build — kept for reference, not in active use."

gemini-3.6-flash:
  input_per_million: 0.075
  output_per_million: 0.30
  note: "PLACEHOLDER — verify against ai.google.dev/gemini-api/docs/pricing before trusting any cost figure derived from this."

qwen3-vl:4b:
  input_per_million: 0.0
  output_per_million: 0.0
  note: "local inference — zero marginal $ cost, but not zero cost (electricity, GPU-hours). Report latency/throughput, not $0 as a headline number."

qwen3-vl:4b-instruct:
  input_per_million: 0.0
  output_per_million: 0.0
  note: "local inference, instruct-tuned variant in active use for this project's fast tier."

gemma3:4b:
